# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - allowance-manager

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ConnectionStrings__Postgres: Host=localhost;Port=5432;Database=child_allowance_manager_test;Username=postgres;Password=postgres
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: child_allowance_manager_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d child_allowance_manager_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build with dotnet
        run: dotnet build --configuration Release

      - name: Test with dotnet
        run: dotnet test --configuration Release --no-build

      - name: Apply database migrations
        run: dotnet run --project ChildAllowanceManager --configuration Release -- --migrate

      - name: dotnet publish
        run: dotnet publish -c Release -o ${{env.DOTNET_ROOT}}/myapp

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      # Required Production environment secret: PRODUCTION_POSTGRES_CONNECTION
      - name: Apply production database migrations
        env:
          ConnectionStrings__Postgres: ${{ secrets.PRODUCTION_POSTGRES_CONNECTION }}
        run: dotnet run --project ChildAllowanceManager -- --migrate

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'allowance-manager'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_FAAC95D339584D58AB2FC636D595A3EF }}
          package: .

      - name: Verify deployed readiness
        run: curl "${{ steps.deploy-to-webapp.outputs.webapp-url }}/health/ready" --retry 10 --retry-delay 6 --retry-all-errors --fail --silent --show-error
