# ---------------------------------------------------------------------------
# 0. PROBLEM STATEMENT
# ---------------------------------------------------------------------------
problem: >
  Commit a585680 ("feat: allow public child balance views") removed [Authorize] from
  /{tenantSuffix}/children and made ChildrenListPage.HasTenantAccessAsync return true for
  unauthenticated callers. Every family's balances and full transaction history are therefore
  readable by anyone who knows or guesses a URL suffix, permanently and un-revocably. The
  motivating use case is legitimate - a kitchen tablet or e-ink frame that shows the children
  their balances without anyone signing in.
goal: >
  Replace ambient public access with named, revocable, optionally-expiring share tokens.
  A parent mints a link, pins it to a display, and can revoke it later without touching
  anyone's login. Everything else returns to sign-in-only.
non_goals:
  - No child accounts, no child login, no per-child credentials.
  - No write access of any kind through a share link. Read-only, always.
  - No email/SMS delivery of share links. The parent copies the URL themselves.

# ---------------------------------------------------------------------------
# 1. ORCHESTRATOR PROTOCOL
# ---------------------------------------------------------------------------
orchestration:
  fan_out: true
  eligibility_rule: >
    A task is eligible when status == pending AND every id in depends_on has status == done
    AND no currently in_progress task shares a value in files_touched or mutex or
    exclusive_resources with it.
  conflict_rule: >
    Two tasks MUST NOT run concurrently if their files_touched lists intersect, or if they
    name the same mutex, or the same exclusive_resources entry.
  claim_protocol:
    - Re-read share-token-plan.yaml immediately before writing any status change. The index is
      a shared write target; stale-read overwrites lose other agents' claims.
    - To claim - set status=in_progress, owner=<agent-id>, updated=<ISO8601 UTC>.
    - Write the claim back, then re-read and confirm owner is still you. If not, abandon and
      pick another task.
    - On success - status=done, updated=<ts>, and append a one-line note to `result`.
    - On failure - status=failed, `result` = the shortest decisive error line. Do NOT modify
      any other task's status.
    - If a precondition in your phase file is false - status=blocked, `result` = which
      precondition failed. Do not improvise around it.
  branch_policy:
    mode: single-branch
    branch: main
    rule: >
      All agents commit to the working tree of repo_root. One task = one commit. Commit
      message format - `<type>(share): <task title>` using conventional commit types
      (feat, fix, refactor, test, chore, docs). Do not push. Do not open PRs. Do not rebase
      or amend another agent's commit.
  on_conflict_detected: >
    If `git status` shows uncommitted changes in a file that is NOT in your files_touched
    list, stop, set status=blocked, and report. Do not commit another agent's work.

