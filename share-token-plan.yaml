# ---------------------------------------------------------------------------
# 4. DECISIONS ALREADY MADE (do not re-open; implement as written)
# ---------------------------------------------------------------------------
decisions:

  S-D1_token_shape:
    ruling: 256-bit random token, Base64Url-encoded, stored ONLY as a SHA-256 hash.
    detail: >
      Mint with RandomNumberGenerator.GetBytes(32) then Base64Url.EncodeToText (or
      WebEncoders.Base64UrlEncode) - 43 URL-safe characters, no padding, no '+' or '/'.
      Persist Convert.ToHexString(SHA256.HashData(Encoding.UTF8.GetBytes(token))) lowercased,
      64 chars, in ShareLink.TokenHash. The plaintext token is returned exactly once, from
      CreateAsync, and is never stored, never logged, never re-displayable. Lookup is a single
      indexed equality query on the hash - no scan, no timing side channel worth defending.
    rationale: A leaked database dump must not yield working display URLs.
    owned_by: [S0-T1, S0-T2]

  S-D2_revocation_is_soft_delete:
    ruling: Revoke == the existing soft-delete convention. Deleted=true, UpdatedTimestamp=now.
    detail: >
      No separate RevokedAt column. `Deleted` already means "no longer live" everywhere in this
      codebase and UpdatedTimestamp already records when that happened; the People page renders
      "Revoked <UpdatedTimestamp:d>" from those two fields.
    owned_by: [S0-T1, S0-T3, S2-T2]

  S-D3_unique_index_is_NOT_filtered:
    ruling: 'IX_ShareLinks_TokenHash is UNIQUE with NO filter. Do not copy the plan.yaml D4 "WHERE NOT Deleted" convention here.'
    detail: >
      A revoked token must be permanently dead. A filtered index would let a future mint collide
      with a revoked hash, and would let a bug that clears Deleted resurrect a revoked URL.
      Uniqueness spans revoked rows. Runtime lookup applies the liveness filter in the query
      instead - `!x.Deleted && (x.ExpiresAt == null || x.ExpiresAt > now)`.
    owned_by: [S0-T2]

  S-D4_expiry_optional:
    ruling: ExpiresAt is nullable. NULL means never expires.
    detail: >
      The product need is a permanent kitchen display; forced expiry guarantees the display goes
      dark at the worst moment. The create dialog offers 30 days / 1 year / Never and defaults to
      Never. Revocation, not expiry, is the control that matters.
    owned_by: [S0-T1, S2-T1]

  S-D5_scope_is_whole_family:
    ruling: A share link grants read access to one tenant - all of its live children.
    detail: >
      No ChildId column, no per-child links. The display device shows the family board. Adding
      per-child scope later is an additive nullable column plus one query filter; there is no
      defect or product need behind it today.
    owned_by: [S0-T1]

  S-D6_one_page_two_routes:
    ruling: >
      ChildrenListPage serves BOTH /{tenantSuffix}/children and /share/{shareToken}. Do not
      fork a second read-only page.
    detail: >
      The page's balance cards, chart, history table and transactions dialog are exactly the
      intended share view. A forked page would duplicate ~140 lines of markup and drift. The
      page gains `[Parameter] public string? ShareToken` and a `_shareMode` flag; in share mode
      it resolves the tenant from the token instead of the suffix.
    rejected_alternative: >
      Synthesising a ClaimsPrincipal with a Tenant claim for share visitors. That would make a
      revoked token survive inside an issued auth cookie and would put a share visitor into
      every IsInRole/HasClaim path in the app. Share access stays outside the identity system.
    owned_by: [S1-T1]

  S-D7_read_only_is_affirmative:
    ruling: >
      Every management control on ChildrenListPage is gated on the single boolean
      CanManageCurrentTenant. The `<AuthorizeView Roles="admin,parent">` wrappers in the markup
      are REMOVED and replaced with `@if (CanManageCurrentTenant)`.
    detail: >
      AuthorizeView Roles="admin,parent" tests GLOBAL roles. "parent" is a global role in this
      codebase (D5 of plan.yaml kept it in the global set, and the Development /login handler
      grants it), so today any signed-in global parent renders Add money / Withdraw / Pause /
      Remove-one-day on ANY family's page. The .cs handlers already re-check
      CanManageCurrentTenant, so this is currently a cosmetic hole - but in share mode it would
      become the visible affordance for an unauthorized writer. One gate closes both.
      In share mode CanManageCurrentTenant is hard false and is never recomputed.
    owned_by: [S1-T2]

  S-D8_share_mode_writes_nothing_to_the_browser:
    ruling: >
      In share mode the page must NOT write ProtectedLocalStorage "current_tenant" /
      "current_tenant_suffix". It MUST still call ICurrentContextService.SetCurrentTenant.
    detail: >
      TenantSuffix is null on the share route, so the existing ProtectedLocalStorage writes
      would store a null suffix in the browser and poison the family context of whoever later
      signs in on that device. Those two writes are the only browser-persisting part of the
      block and are the only part that is suppressed.
      SetCurrentTenant is NOT suppressed. ICurrentContextService is a scoped, in-memory
      per-circuit holder (Services/CurrentContextService.cs - a private field and a getter, no
      persistence), and TenantNotificationService.OnChildStateChanged filters live push events
      with `tenantId == _currentContextService.GetCurrentTenant()`. Suppressing it would leave
      a share display with no push refresh at all and make the S-D9 poll the only refresh
      mechanism. Keeping it costs nothing and keeps the display live to the second when a
      parent adds money.
    owned_by: [S1-T2]

  S-D9_liveness_is_rechecked_on_the_open_circuit:
    ruling: >
      Revocation must take effect on a display that is already rendering. Share mode runs a
      PeriodicTimer (5 minutes) that re-resolves the token and reloads data.
    detail: >
      A Blazor Server circuit pinned to a wall for months would otherwise render a revoked
      family forever, and would also never notice midnight rolling over. When the re-resolve
      returns null the page navigates to /share/expired. The same timer is the data refresh, so
      it is not extra machinery.
    owned_by: [S1-T3]

  S-D10_last_used_is_throttled:
    ruling: LastAccessedAt is written at most once per hour per link.
    detail: >
      `if (link.LastAccessedAt is null || link.LastAccessedAt < now.AddHours(-1))` then write.
      A 5-minute polling kiosk otherwise issues an UPDATE forever, for a field whose only
      consumer is a "Last used" column rendered to the day.
    owned_by: [S0-T3]

  S-D11_never_log_the_token:
    ruling: Log ShareLink.Id. Never log the plaintext token, never log TokenHash.
    detail: >
      Applies to ILogger calls, exception messages and snackbar text. The token appears in the
      URL path, which is enough exposure already - see S-D12.
    owned_by: [S0-T3, S1-T1, S1-T4]

  S-D12_share_route_headers:
    ruling: >
      Requests whose path starts with /share get `Referrer-Policy: no-referrer` and
      `X-Robots-Tag: noindex, nofollow`, set in the existing inline app.Use block in Program.cs.
    detail: >
      A bearer secret in a URL path leaks through the Referer header to any third-party asset
      and through search indexing if the URL is ever posted. There is no Middleware/ directory
      in this repo - do not create one for two header lines.
    owned_by: [S1-T4]

  S-D13_lockdown_lands_last:
    ruling: >
      /{tenantSuffix}/children regains [Authorize] and HasTenantAccessAsync stops returning true
      for anonymous callers ONLY after the share route and the mint/revoke UI both work.
    detail: >
      Phase S3 depends on S1 and S2 so that no deployed display goes dark between the lockdown
      landing and the replacement existing.
    owned_by: [S3-T1]

  S-D14_deferred:
    ruling: The following are explicitly deferred, not forgotten.
    deferred:
      - name: Rate limiting / brute-force protection on /share/{token}
        why: >
          The token is 256 bits of CSPRNG output. Guessing is not a threat model that a fixed
          window limiter improves. Revisit only if share URLs are ever shortened or made
          human-typeable.
      - name: Per-child share links
        why: See S-D5. Additive nullable column when a real need appears.
      - name: Share-link access audit log (one row per view)
        why: >
          LastAccessedAt answers "is this display still alive". A full access log is a new
          table and a retention question with no product driver.
      - name: A dedicated kiosk chrome (hide the app bar, sign-in button and nav drawer)
        why: >
          MainLayout already renders nothing family-specific to anonymous visitors - the family
          switcher and account menu are inside <AuthorizeView><Authorized>. A "Sign in" button
          on a fridge display is cosmetic. Revisit on real feedback.

