# ---------------------------------------------------------------------------
# 1. ORCHESTRATOR PROTOCOL
# ---------------------------------------------------------------------------
orchestration:
  fan_out: true
  eligibility_rule: >
    A task is eligible when status == pending AND every id in depends_on has
    status == done AND no currently in_progress task shares a value in
    files_touched or mutex or exclusive_resources with it.
  conflict_rule: >
    Two tasks MUST NOT run concurrently if their files_touched lists intersect,
    or if they name the same mutex, or the same exclusive_resources entry.
    This is the hard scheduling constraint. depends_on already serializes most
    such pairs; mutex covers the rest.
  claim_protocol:
    - Re-read plan.yaml immediately before writing any status change. The index is a
      shared write target; stale-read overwrites lose other agents' claims.
    - To claim - set status=in_progress, owner=<agent-id>, updated=<ISO8601 UTC>.
    - Write the claim back, then re-read and confirm owner is still you. If not, abandon
      and pick another task.
    - On success - status=done, updated=<ts>, and append a one-line note to `result`.
    - On failure - status=failed, populate `result` with the shortest decisive error line,
      and do NOT modify any other task's status.
    - If a precondition in your phase file is false - status=blocked, `result` = which
      precondition failed. Do not improvise around it.
  branch_policy:
    mode: single-branch
    branch: main
    rule: >
      All agents commit to the working tree of repo_root. One task = one commit.
      Commit message format - `<type>(<phase-slug>): <task title>` using conventional
      commit types (fix, feat, refactor, test, chore, docs, style). Do not push.
      Do not open PRs. Do not rebase or amend another agent's commit.
  on_conflict_detected: >
    If `git status` shows uncommitted changes in a file that is NOT in your
    files_touched list, stop, set status=blocked, and report. Do not commit
    another agent's work.

