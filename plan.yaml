# ---------------------------------------------------------------------------
# 4. DECISIONS ALREADY MADE (do not re-open; implement as written)
# ---------------------------------------------------------------------------
decisions:
  D1_negative_balances:
    ruling: ALLOWED.
    detail: >
      A withdrawal may drive a balance below zero. The product rule is explicit -
      "A withdrawal can take a balance below zero. The app shows the resulting balance
      before you confirm." Implement as - WithdrawFundsDialogue shows an inline warning
      and requires a second confirm when Child.Balance - Amount < 0. No service-level block.
    owned_by: [P04-T6, P06-T4]
  D2_unused_transaction_types:
    ruling: KEEP the enum members, PIN their numeric values, hide from UI.
    detail: >
      TransactionType is persisted as `integer`. Removing members renumbers the rest and
      corrupts existing rows. Assign explicit values matching today's implicit ordering -
      DailyAllowance=0, BirthdayAllowance=1, Withdrawal=2, Deposit=3, Transfer=4,
      Adjustment=5, Interest=6, Hold=7, Other=8. Add XML doc comments marking Transfer,
      Interest and Other as "reserved - no product flow; do not surface in UI".
    owned_by: [P04-T7]
  D3_delete_semantics:
    ruling: Soft delete stays. Copy must stop claiming permanence. Restore path is built for tenants and children.
    detail: >
      Replace "This cannot be undone." with "This hides the family and its children.
      An administrator can restore it." (tenant) / "This hides the child and their history.
      A parent can restore them." (child). Admin page gains a "Deleted" section listing
      soft-deleted tenants with a Restore action; the child management page gains the same
      for children.
    owned_by: [P04-T8, P10-T6]
  D4_deleted_suffix_reuse:
    ruling: Unique indexes become filtered on NOT Deleted.
    detail: >
      IX_Tenants_UrlSuffix -> unique WHERE NOT "Deleted". IX_Users_Email -> unique
      WHERE NOT "Deleted". Service-level duplicate checks must add `&& !x.Deleted`
      to match (TenantService.AddTenant and UpdateTenant currently omit it).
    owned_by: [P03-T3, P04-T9]
  D5_tenant_roles:
    ruling: Introduce a TenantMembership entity. User.Roles stays for GLOBAL roles only (admin).
    detail: >
      TenantMembership { Id, UserId, TenantId, Role, Deleted, timestamps } replaces
      User.Tenants[] as the authority for tenant access, and carries the per-tenant role.
      User.Tenants remains a persisted column during migration for rollback safety but is
      no longer read after P08-T2; P08-T5 removes reads. ValidRoles gains
      TenantRoles = { Parent = "parent" } scoping note. Global role set stays { admin, parent }
      so existing [Authorize(Roles=...)] attributes keep compiling.
    owned_by: [P03-T4, P08-T1, P08-T2, P08-T5]
  D6_timezone_storage:
    ruling: Per-tenant IANA timezone id, stored as text, default "Europe/London".
    detail: >
      TenantConfiguration.TimeZoneId (string, NOT NULL, default 'Europe/London'). Resolve with
      TimeZoneInfo.FindSystemTimeZoneById - .NET 10 on Linux and Windows both accept IANA ids.
      The Quartz trigger changes from one daily UTC fire to hourly, and the job pays a tenant
      only when local time in that tenant's zone has just crossed 00:01.
    owned_by: [P03-T2, P05-T1, P05-T2, P05-T3]
  D7_idempotency:
    ruling: Client-supplied RequestId (GUID) on AllowanceTransaction, unique per tenant when set.
    detail: >
      AllowanceTransaction.RequestId (string?, max 64). Unique filtered index on
      (TenantId, RequestId) WHERE "RequestId" IS NOT NULL. TransactionService.AddTransaction
      returns the existing row when a RequestId collides, same shape as the existing
      AllowanceDate de-duplication branch. Dialogs generate one RequestId per dialog
      instance, not per click.
    owned_by: [P03-T5, P04-T3, P06-T3]
  D8_migrations_at_deploy:
    ruling: Application startup no longer migrates. A dedicated command does.
    detail: >
      Program.cs gains `--migrate` argv handling - when present, the host applies migrations
      and exits with code 0 (or 1 on failure) without serving. CI runs it as a deploy step.
      Development still auto-migrates and seeds, gated on IsDevelopment().
    owned_by: [P02-T3, P12-T5]
  D9_fonts:
    ruling: Self-host. No Google Fonts CDN link.
    detail: >
      Remove the fonts.googleapis.com <link>. Ship DM Sans (400/500/600/700) and
      Fraunces (600) as woff2 under wwwroot/fonts/ with @font-face declarations and
      font-display: swap. Nunito is dropped entirely.
    owned_by: [P09-T3]
  D10_out_of_scope:
    ruling: The audit's "Feature opportunities" that are NOT findings are deferred, explicitly.
    deferred:
      - Savings goals / labelled allowance categories - new product surface, no defect behind it.
      - Optional child-facing read-only view - new auth surface, no defect behind it.
    covered_elsewhere: >
      The other feature opportunities (tenant switcher, invitation lifecycle, configurable
      schedule + timezone, audit/export/correction/restore) ARE findings and are covered by
      phases 05, 07, 08 and 04.

