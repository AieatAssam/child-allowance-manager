phase: P02
title: EF migration baseline, model snapshot, deploy-time migration
covers: [A-P1-3]
read_before_starting: [plan.yaml]
context: >
  ChildAllowanceManager/Migrations/20260810180000_Initial.cs is hand-written. Its
  BuildTargetModel override has an EMPTY body and there is no AllowanceDbContextModelSnapshot.
  Consequence - `dotnet ef migrations add` will scaffold a migration that recreates every
  table, because EF believes the current model state is empty. Every later schema change in
  this plan is blocked on fixing that. Additionally Program.cs applies migrations inside the
  web boot path, so a database problem prevents the app from serving at all.

tasks:

  - id: P02-T1
    title: Replace the hand-written Initial migration with a scaffolded baseline plus model snapshot
    files_touched:
      - ChildAllowanceManager/Migrations/20260810180000_Initial.cs
      - ChildAllowanceManager/Migrations/
    exclusive_resources: [postgres-test-db]
    preconditions:
      - "`dotnet tool restore` succeeds and `dotnet ef --version` prints 10.x (P00-T1)."
      - "The current model in Data/AllowanceDbContext.cs is unchanged from the audit snapshot - four entities, no foreign keys."
    steps:
      - Record the exact SQL the current hand-written migration produces, for comparison - `dotnet ef migrations script --project ChildAllowanceManager --context AllowanceDbContext --output /tmp/baseline-before.sql`.
      - Delete ChildAllowanceManager/Migrations/20260810180000_Initial.cs.
      - >
        Scaffold a fresh baseline - `dotnet ef migrations add Initial --project ChildAllowanceManager
        --context AllowanceDbContext --output-dir Migrations`. This writes three files -
        `<timestamp>_Initial.cs`, `<timestamp>_Initial.Designer.cs`, and
        `AllowanceDbContextModelSnapshot.cs`.
      - >
        Generate the new SQL - `dotnet ef migrations script --project ChildAllowanceManager
        --context AllowanceDbContext --output /tmp/baseline-after.sql` - and diff it against
        /tmp/baseline-before.sql. The two must be equivalent - same four tables, same columns
        and types, same five indexes including the filtered unique index on
        (TenantId, ChildId, AllowanceDate). Ordering and quoting differences are acceptable;
        a missing or extra object is not. If they differ materially, set status=blocked and
        report the diff - do not hand-edit the scaffolded migration to match.
      - Do NOT hand-edit the generated Designer or ModelSnapshot files at any point, in this or any later task. They are regenerated by the tool.
    invariants:
      - The scaffolded migration must be a pure CREATE - it must contain no DROP outside the Down method.
      - AllowanceDbContextModelSnapshot.cs must exist after this task and must be committed.
    acceptance:
      - "`dotnet build ChildAllowanceManager.sln -c Release` exits 0"
      - "`dotnet ef migrations list --project ChildAllowanceManager` prints exactly one migration named Initial."
      - "`dotnet ef migrations add __Probe --project ChildAllowanceManager` produces a migration with an EMPTY Up body (proving the snapshot matches the model). Then `dotnet ef migrations remove --project ChildAllowanceManager` to delete the probe. The probe must NOT be committed."
      - "`CAM_TEST_DB=cam_test_p02t1 CAM_TEST_KEEP=1 bash scripts/test-postgres.sh` exits 0 - PostgresTestDatabase.CreateMigratedContextAsync exercises the new baseline."
    commit: "fix(migrations): scaffold a real baseline migration and model snapshot"

  - id: P02-T2
    title: Compatibility migration for databases created by EnsureCreated
    files_touched: [ChildAllowanceManager/Migrations/]
    problem: >
      A database created by EnsureCreated (the historical path, still used by
      PostgresTestDatabase.CreateCleanContextAsync) has the correct schema but an empty
      __EFMigrationsHistory table. Applying the baseline against it fails with
      "relation already exists".
    steps:
      - >
        Create ChildAllowanceManager/Migrations/BaselineCompatibility.cs - a small static helper
        `public static class BaselineCompatibility` with
        `public static Task EnsureBaselineRecordedAsync(AllowanceDbContext db, CancellationToken ct)`.
      - >
        Its logic - if the __EFMigrationsHistory table does not exist AND the "Tenants" table does
        exist, create __EFMigrationsHistory with the standard EF shape and insert a single row for
        the Initial migration id, so the baseline is treated as already applied. Read the migration
        id from `db.Database.GetMigrations().First()` rather than hard-coding a timestamp.
        Use raw SQL via `db.Database.ExecuteSqlRawAsync`. The standard shape is -
        `CREATE TABLE "__EFMigrationsHistory" ("MigrationId" character varying(150) NOT NULL, "ProductVersion" character varying(32) NOT NULL, CONSTRAINT "PK___EFMigrationsHistory" PRIMARY KEY ("MigrationId"));`
      - Detect table existence with `SELECT to_regclass('public."Tenants"') IS NOT NULL`.
      - This helper is invoked by the `--migrate` command added in P02-T3, before MigrateAsync.
    acceptance:
      - "`dotnet build` exits 0"
      - "Against a database created with EnsureCreatedAsync, EnsureBaselineRecordedAsync followed by MigrateAsync completes without error and leaves the schema intact (no data loss)."
      - "Against an empty database, EnsureBaselineRecordedAsync is a no-op and MigrateAsync creates everything."
      - "Calling EnsureBaselineRecordedAsync twice is a no-op the second time."
    commit: "fix(migrations): add an EnsureCreated compatibility baseline"

  - id: P02-T3
    title: Move migrations off the web boot path behind a --migrate command
    files_touched: [ChildAllowanceManager/Program.cs]
    mutex: program-cs
    steps:
      - file: ChildAllowanceManager/Program.cs
        anchor: |-
          await using (var scope = app.Services.CreateAsyncScope())
          {
              var db = scope.ServiceProvider.GetRequiredService<AllowanceDbContext>();
              await db.Database.MigrateAsync();
              if (app.Environment.IsDevelopment())
                  await new DevelopmentDataSeeder(db).SeedAsync();
          }
        replace_with: |
          var migrateOnly = args.Contains("--migrate", StringComparer.OrdinalIgnoreCase);
          if (migrateOnly || app.Environment.IsDevelopment())
          {
              await using var scope = app.Services.CreateAsyncScope();
              var db = scope.ServiceProvider.GetRequiredService<AllowanceDbContext>();
              var migrationLogger = scope.ServiceProvider
                  .GetRequiredService<ILoggerFactory>().CreateLogger("Migrations");
              try
              {
                  await BaselineCompatibility.EnsureBaselineRecordedAsync(db, CancellationToken.None);
                  await db.Database.MigrateAsync();
                  migrationLogger.LogInformation("Database migrations applied.");
              }
              catch (Exception ex)
              {
                  migrationLogger.LogError(ex, "Database migration failed.");
                  if (migrateOnly)
                      return 1;
                  throw;
              }

              if (app.Environment.IsDevelopment() && !migrateOnly)
                  await new DevelopmentDataSeeder(db).SeedAsync();
          }

          if (migrateOnly)
              return 0;
      - >
        Top-level statements infer `Task<int>` only when every return path returns a value.
        Change the final `app.Run();` to `app.Run();` followed by `return 0;`, then build.
        IF THE COMPILER REJECTS the mixed returns (the `return 1;` sits inside a try/catch that
        precedes `app.Run()`), do not fight it - use `Environment.ExitCode = 1; return;` for the
        failure path and a bare `return;` for the migrate-only success path, drop the trailing
        `return 0;`, and record the deviation in `result`. Either shape satisfies the requirement,
        which is a non-zero exit on migration failure and no Kestrel bind under --migrate.
      - >
        Add `using ChildAllowanceManager.Migrations;` (or whatever namespace BaselineCompatibility
        was declared in by P02-T2) to the using block at the top of Program.cs.
    rules:
      - Production and Staging must NOT migrate on boot. Only `--migrate` or Development do.
      - The `--migrate` run must not start Kestrel. The early `return` before `app.Run()` guarantees this.
    acceptance:
      - "`dotnet build` exits 0"
      - "`dotnet run --project ChildAllowanceManager -- --migrate` against a reachable database exits 0 and does not bind a port."
      - "`dotnet run --project ChildAllowanceManager -- --migrate` against an unreachable database exits 1 and logs 'Database migration failed.'"
      - "With ASPNETCORE_ENVIRONMENT=Production and no --migrate, the app starts without calling MigrateAsync."
    commit: "fix(migrations): run migrations as a deploy step rather than on boot"

  - id: P02-T4
    title: Migration lifecycle tests
    files_touched: [tests/ChildAllowanceManager.Tests/MigrationTests.cs]
    create_file: tests/ChildAllowanceManager.Tests/MigrationTests.cs
    exclusive_resources: [postgres-test-db]
    required_tests:
      - name: Migrating_a_fresh_database_creates_the_full_schema
        does: "PostgresTestDatabase.CreateMigratedContextAsync(); assert all four DbSets are queryable and return zero rows."
      - name: Model_has_no_pending_changes
        does: >
          Assert the model snapshot matches the context - construct the context and assert
          `db.Database.GetPendingMigrations()` is empty after MigrateAsync, and that
          `db.GetService<IMigrationsModelDiffer>().HasDifferences(...)` is false comparing the
          last migration's target model against the runtime model. If wiring the differ proves
          awkward, assert instead that `AllowanceDbContextModelSnapshot.cs` exists on disk and
          is non-empty, and leave a `ponytail:` comment naming the weaker check.
      - name: EnsureCreated_database_can_be_migrated_after_baseline_compatibility
        does: >
          CreateCleanContextAsync (EnsureCreated), insert one tenant, call
          BaselineCompatibility.EnsureBaselineRecordedAsync, call MigrateAsync,
          assert the tenant row still exists.
    acceptance:
      - "`CAM_TEST_DB=cam_test_p02t4 CAM_TEST_KEEP=1 bash scripts/test-postgres.sh` exits 0"
      - "All three tests exist and pass."
    commit: "test(migrations): cover baseline, snapshot and compatibility"
