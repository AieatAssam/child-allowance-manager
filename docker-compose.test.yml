name: cam-test

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: child_allowance_manager_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d child_allowance_manager_test"]
      interval: 2s
      timeout: 5s
      retries: 15
